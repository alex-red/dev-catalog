schemaVersion: 1
id: disk-reclaim
type: script
title: Reclaim disk space from developer caches and build output
summary: An interactive Bash script that finds reclaimable space in developer caches, build output, idle projects, Docker, temp dirs and the Trash. It lists sizes by risk and asks before cleaning selected items. Direct file deletion checks local paths, and external cleaners manage their own stores.
useWhen: A development machine is running low on disk and you want to see which caches, node_modules, build outputs and leftovers are worth clearing before deleting anything.
tags: [ cleanup, disk-space, caches, cli ]
platforms: [ macos, linux ]
requires: [ bash ]
rating:
  rubric: dev-v1
  dimensions:
    value: 4
    dependability: 3
    ease: 3
    safety: 3
    adoption: 4
    portability: 3
    upkeep: 3
  evidence: tested
  reviewed: 2026-11-05
  notes: Sizes are estimates, and cache layouts can change. Direct deletion rejects symlinked parent directories. Docker cleanup skips remote transports and targets the socket selected during the scan. Review-level items such as Docker volumes or the Trash delete data for good. Tests cover filesystem safety and Docker endpoint selection with fixtures.
source:
  kind: original
  license: MIT
  author: Alex Red
overlap: ncdu, dust and gdu show where space goes but not what is safe to delete. docker system prune, brew cleanup, npm cache clean and go clean -cache each clear one tool. npkill and kondo clear project build artifacts only.
evidence: [ tests/disk-reclaim.test.ts ]
