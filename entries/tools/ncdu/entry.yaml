  license: MIT
  author: Yoran Heling and contributors
  notes: The source revision is the v2.9.2 tag in the upstream Git repository at https://g.blicky.net/ncdu.git/.
install:
  macos: brew install ncdu
  linux: Install ncdu through your distribution or download the matching static Linux binary from the upstream download page.
