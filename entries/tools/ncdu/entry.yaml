schemaVersion: 1
id: ncdu
type: tool
title: ncdu interactive disk usage browser
summary: Scan disk usage once, then drill into large directories and switch between allocated and apparent size in a terminal interface.
useWhen: A quick size summary shows a large directory and you want to inspect its contents interactively, including over SSH.
tags: [ cli, disk-space ]
platforms: [ macos, linux ]
rating:
  rubric: dev-v1
  dimensions:
    value: 4
    dependability: 4
    ease: 4
    safety: 3
    adoption: 4
    portability: 3
    upkeep: 4
  evidence: reviewed
  reviewed: 2026-11-05
  notes: On ncdu 2.x, use ncdu -rr -x . to disable deletion and shell access and stay on one filesystem. Confirm the major version when installing from a distribution. For large scans, narrow the starting path or exclude irrelevant subtrees.
source:
  kind: linked
  url: https://dev.yorhel.nl/ncdu
