schemaVersion: 1
id: jujutsu
type: tool
title: Jujutsu version control with a Git backend
summary: Use jj to edit stacked changes, split and squash commits, and recover local operations through the operation log while collaborating through Git remotes.
useWhen: You frequently revise earlier commits in a stack and spend time rebasing descendants or recovering from local history edits.
tags: [ cli, git, branches ]
platforms: [ macos, linux, windows ]
rating:
  rubric: dev-v1
  dimensions:
    value: 4
    dependability: 3
    ease: 2
    safety: 3
    adoption: 2
    portability: 4
    upkeep: 3
  evidence: reviewed
  reviewed: 2026-11-05
  review: docs/reviews/2026-11-05-recommendation-blockers.md
  notes: Automatic descendant rebases and the local operation log help with stacked changes. The working copy is snapshotted as a commit, so check ignore rules and review changes before pushing. Check Git hooks and editor integrations before switching. Jujutsu preserves Git submodule references but does not populate their files. Use Git when builds or tests need those files.
source:
  kind: linked
  url: https://github.com/jj-vcs/jj
  revision: d16ee1fc88a72c54142241b079a34bbf3b033bc0
  version: 0.47.1
  retrieved: 2026-11-05
  license: Apache-2.0
  author: Martin von Zweigbergk and contributors
install:
  macos: brew install jj
  linux: Download the jj release archive for your architecture, extract it, and put jj on PATH.
  windows: winget install --exact --id jj-vcs.jj
inspiredBy:
  - title: Jujutsu Git compatibility documentation
    url: https://docs.jj-vcs.dev/latest/git-compatibility/
