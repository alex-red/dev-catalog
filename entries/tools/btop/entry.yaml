title: btop system resource dashboard
summary: View CPU, memory, disks, networking, and processes together in an interactive terminal dashboard.
useWhen: You need to see whether local slowdowns line up with resource pressure and identify the processes involved.
tags: [ cli, monitoring, debugging ]
platforms: [ macos, linux ]
